[Mod]
Name=超级AI (Super AI)
Version=3.9
Author=VERA20K-SuperAI contributors
About=回归原版三难度的建造节奏，只保留两条机制：一、部队进攻极积极——所有队伍不集结、出生即冲锋、家里不留守家队，地图每 20 秒 All to Hunt 清场避免堵车；二、建筑被打掉就立刻重建（AIRestrictReplaceTime=0），扩建靠这种被动触发式重建。基地规模：建造厂少于 3 座就立刻补基地车展开，每户稳定铺到 3 个基地并长期保持。冷酷难度额外规划 3 个兵营、5 个战车工厂（中等/简单保持 1 个）。AI 完全不造围墙。空指部上限 0→4（AI 才会造第二座以后）；机场型飞机（入侵者/黑鹰）每队 3 架、队伍上限 3（停机位是硬约束，超了就起飞坠毁）；基洛夫 6–8 架；火箭飞行兵每队 6 人、空军触发器权重 ×3 并钉死（不受胜率衰减）、空队伍解散延迟 900→2400，防空触发器权重 ×2。盟/苏防空建筑改成和尤里盖特机炮同形状（防空炮同时算反步兵/反装甲），因此防御抽签里防空占比从 12–17% 提到 20% 以上，防御节点总数不变。0 号位玩家获得**独立类型的无限核弹**（新增超武类型 `ZAIUnlimitedNuke`：`SW.AlwaysGranted=yes` 无需发射井 + `RechargeTime=0` 零冷却 + `SW.AllowAI=no`），电脑的 `NukeSpecial` 原封不动、行为不变。超级武器充满即自动发射（核弹/闪电风暴/心灵控制器/基因突变器打敌方空地；铁幕/超时空由零售的队伍脚本施放（脚本动作 53 集结到敌基地 → 55 铁幕 / 57 超时空 → 进攻），2.4 曾把这些脚本一起覆盖掉，现已恢复并加构建期断言防回归）。另：新增一张纯平雪地 120 人地图（玩家居中、开局即被铁幕罩住、119 家均布全图）。电脑资金 ×1001、建造速度大幅提高、维修厂可建（AI 因此能补造基地车重建被摧毁的建造厂）。基地车与建造厂数值保持原版。
Terms=工具与文档 MIT；规则/地图为同人衍生素材，仅供非商业游玩。

