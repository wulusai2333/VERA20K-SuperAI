[Mod]
Name=超级AI (Super AI)
Version=2.8
Author=VERA20K-SuperAI contributors
About=回归原版三难度的建造节奏，只保留两条机制：一、部队进攻极积极——所有队伍不集结、出生即冲锋、家里不留守家队，地图每 20 秒 All to Hunt 清场避免堵车；二、建筑被打掉就立刻重建（AIRestrictReplaceTime=0），扩建靠这种被动触发式重建。基地规模：建造厂少于 3 座就立刻补基地车展开，每户稳定铺到 3 个基地并长期保持。冷酷难度额外规划 3 个兵营、5 个战车工厂（中等/简单保持 1 个）。AI 完全不造围墙。超级武器充满即自动发射（核弹/闪电风暴/心灵控制器/基因突变器打敌方空地；铁幕罩自家部队、超时空传送自家部队，按 Ares SW.* 的 cell_set/AffectsHouse 配置）。另：电脑资金 ×1001、建造速度大幅提高、维修厂可建（AI 因此能补造基地车重建被摧毁的建造厂）。基地车与建造厂数值保持原版。
Terms=工具与文档 MIT；规则/地图为同人衍生素材，仅供非商业游玩。

[Files]
Rules=rulesmd.ini
