[Mod]
Name=超级AI (Super AI)
Version=3.10.3
Author=VERA20K-SuperAI contributors
About=回归原版三难度的建造节奏，只保留两条机制：一、部队进攻极积极——所有队伍不集结、出生即冲锋、家里不留守家队，地图每 20 秒 All to Hunt 清场避免堵车；二、建筑被打掉就立刻重建（AIRestrictReplaceTime=0），扩建靠这种被动触发式重建。基地规模：建造厂少于 3 座就立刻补基地车展开，每户稳定铺到 3 个基地并长期保持。冷酷难度额外规划 3 个兵营、5 个战车工厂（中等/简单保持 1 个）。AI 完全不造围墙。空指部上限 0→4（AI 才会造第二座以后）；机场型飞机（入侵者/黑鹰）每队 3 架、队伍上限 3（停机位是硬约束，超了就起飞坠毁）；基洛夫 6–8 架；火箭飞行兵每队 6 人、空军触发器权重 ×3 并钉死（不受胜率衰减）、空队伍解散延迟 900→2400，防空触发器权重 ×2。盟/苏防空建筑改成和尤里盖特机炮同形状（防空炮同时算反步兵/反装甲），因此防御抽签里防空占比从 12–17% 提到 20% 以上，防御节点总数不变。0 号位玩家获得**独立类型的无限核弹**（新增超武类型 `ZAIUnlimitedNuke`：`SW.AlwaysGranted=yes` 无需发射井 + `RechargeTime=0.01`（≈0.6 秒；写 0 会被引擎当作未设置而回落到 10 分钟）+ `SW.Shots=1000` + `SW.AllowAI=no`），电脑的 `NukeSpecial` 原封不动、行为不变。另有**核弹兵空投** `ZAIWorldNuke`（`Type=ParaDrop`）：点一次运输机就投下 `ZAINukeTrooper` —— 一个 `JumpJet=yes` 会飞的核弹兵（`Primary=ZAINukeRifle` —— **天启导弹克隆**：`ROF=80`、`Burst=2`、`Range=200`、`Inaccurate=yes`，弹丸 `AG=yes` + `ROT=10` + `Inaccurate=yes` + `FlakScatter=yes`，弹丸**改成高炮式弹道弹**（`Arcing=true`、非追踪、`FlakScatter=yes`、`Inaccurate=yes`）——追踪弹一定会咬住目标，所以之前改用 `[CombatDamage] BallisticScatter=200`（单位格）才生效；同时把零售高炮弹丸 `[FlakProj]`/`[FlakTProj]` 的散布关掉，AI 防空不受影响；弹头换成自建 `[ZAINukeWH]`（[NUKE] 克隆 + 弹头级 `BallisticScatter=200`）；`GuardRange=200` 自动索敌；`Strength=100000`）。空投用的运输机 `[PDPLANE]` 也加固成 `Strength=100000/Armor=heavy/Insignificant=yes`，不会再被防空打下来。VERA 的 paradrop **只读按阵营的步兵列表**（`AmerParaDropInf/AllyParaDropInf/SovParaDropInf/YuriParaDropInf`），所以把四个列表都指向它；`ParaDrop.Types` 与 `Type=DropPod` 实测都不生效（前者投伞兵、后者完全没反应）。飞艇本身（基洛夫机体克隆）：战车工厂可造（`Prerequisite=GAWEAP`、`TechLevel=1`、造价 2000），`Strength=100000` + `Insignificant=yes` 打不掉、防空不瞄，`BalloonHover=yes` 永不落地（不需要停机位），武器 `ZAINukeMissile` 是**神盾式追踪导弹**（弹丸克隆 `AAHeatSeeker2`，`AG=yes` 才能打地面）配 `Warhead=NUKE` 核弹头；它不进任何 TaskForce，所以电脑不会造。另：`GuardRange=200` 自动索敌（`Range` 只是武器射程）、`OpportunityFire=yes` 边飞边打、武器 `Range=200` + `Burst=8` 依次连投、`OmniFire=yes` 任意角度开火。超级武器充满即自动发射（核弹/闪电风暴/心灵控制器/基因突变器打敌方空地；铁幕/超时空由零售的队伍脚本施放（脚本动作 53 集结到敌基地 → 55 铁幕 / 57 超时空 → 进攻），2.4 曾把这些脚本一起覆盖掉，现已恢复并加构建期断言防回归）。另：新增一张纯平雪地 120 人地图（玩家居中、开局即被铁幕罩住、119 家均布全图）。电脑资金 ×1001、建造速度大幅提高、维修厂可建（AI 因此能补造基地车重建被摧毁的建造厂）。基地车与建造厂数值保持原版。
Terms=工具与文档 MIT；规则/地图为同人衍生素材，仅供非商业游玩。

