[Mod]
Name=超级AI (Super AI)
Version=3.13.10
Author=VERA20K-SuperAI contributors
About=回归原版三难度的建造节奏，只保留两条机制：一、部队进攻极积极——所有队伍不集结、出生即冲锋、家里不留守家队，地图每 5 分钟按户错峰 All to Hunt 清场避免堵车；二、建筑被打掉就立刻重建（AIRestrictReplaceTime=0），扩建靠这种被动触发式重建。基地规模：建造厂少于 3 座就立刻补基地车展开，每户稳定铺到 3 个基地并长期保持。冷酷难度额外规划 3 个兵营、5 个战车工厂（中等/简单保持 1 个）。AI 完全不造围墙。空指部上限 0→4（AI 才会造第二座以后）；机场型飞机（入侵者/黑鹰）每队 4 架、队伍上限 3（停机位是硬约束，超了就起飞坠毁）；基洛夫 3/4 架；火箭飞行兵每队 6 人、空军触发器权重 ×3 并钉死（不受胜率衰减）、空队伍解散延迟 900→2400，防空触发器权重 ×2。盟/苏防空建筑改成和尤里盖特机炮同形状（防空炮同时算反步兵/反装甲），因此防御抽签里防空占比从 12–17% 提到 20% 以上，防御节点总数不变。0 号位玩家获得**独立类型的无限核弹**（新增超武类型 `ZAIUnlimitedNuke`：`SW.AlwaysGranted=yes` 无需发射井 + `RechargeTime=0.01`（≈0.6 秒；写 0 会被引擎当作未设置而回落到 10 分钟）+ `SW.Shots=1000` + `SW.AllowAI=no`），电脑的 `NukeSpecial` 原封不动、行为不变。（空投方案已整体撤回：它只能改公共的 `*ParaDropInf` 表，会连电脑一起改；核弹飞艇仍可在战车工厂建造）。另：`ParaDropSpecial`/`AmericanParaDropSpecial` 已设 `SW.AllowAI=no`（电脑不再空投核弹兵）。另：两艘飞艇都是 `GuardRange=200` + 武器 `Range=200`（`Range` 只是武器射程，索敌半径才是 `GuardRange`；两者必须相等，否则它会追着打不到的目标转）、`OpportunityFire=yes` 边飞边打、`OmniFire=yes` 任意角度开火；第二个（追踪弹）`Burst=8` 依次连投。**3.12.0 起三个超武分名**：无限核弹仍叫「核弹攻击」，两艘飞艇的投放按钮分别叫「核弹炮艇」「空中炮艇」——`UIName=` 是 CSF 标签而不是文字，所以模组自带一张 `ares.csf` 提供这两行（缺标签游戏里会画成 `MISSING:'…'`）。第二个飞艇的弹头从零售 `[NUKE]` 换成它的克隆段 `ZAINukeMissileWH`：引擎按**弹头名字** `strcmpi(warhead,"NUKE")` 触发核弹特判（屏幕闪白 + 整张地图光照重算 + 雷达事件 + 等 `NUKEBALL` 动画），换名后只剩 `AnimList=NUKEANIM` 的蘑菇云，伤害与爆炸半径仍与零售核弹完全一致。**3.13.0 起第四个超武「集束炮艇」，3.13.10 定稿**：基洛夫机体（`ZAINukeGunship3`，战车工厂可造 + 超武投放），射速/射程用空中炮艇的（`ROF=9`、`Range=200`、`Sight=200`）。一次开火 **4 发齐射**（`Burst=4` + 四个 `BurstDelay0..3=0`，约 0.27 秒，精英天启同款节奏），每发母弹落在点击点外 **0–200 格**任意处（`BallisticScatter 0/200`，配 `FlakScatter=no`），**母弹本身就是一颗完整的 10 格核爆**（`ZAINukeMissileWH`、`NUKEANIM`、不闪白）；爆开时各分裂 **1 颗**追踪子弹（`Splits=yes`、`Cluster=1`、**`AroundTarget=yes`**），4 颗子弹全部飞回**你点击的那个格**、在 ±3 格内炸开。合计 **4 母 + 4 子 = 8 个弹头**：4 个随机核爆 + 1 个被集火的点，也就是 4+1 个落点。**为什么是 4 不是 8**：`Burst` 每 tick 一发、默认间隔 3–5 帧，单位只有 4 个 `BurstDelay` 槽，8 发会拖成 1.4–2.3 秒的排队，4 发才压得进 0.27 秒。**为什么子弹要飞回点击点**：`Splits` 支路的随机格只有 ±3，把 8 颗摊在母弹周围只会糊成 4 团；集中回目标点反而多出第 5 个落点。三艘炮艇的 `Cost`：核弹炮艇 1000000、空中炮艇 100000、集束炮艇 10000000（本模组 `BuildSpeed=.025` 是全局的，所以这三个价格等于"只能靠超武投放"；投放超武不看价格）。超级武器充满即自动发射（核弹/闪电风暴/心灵控制器/基因突变器打敌方空地；铁幕/超时空由零售的队伍脚本施放（脚本动作 53 集结到敌基地 → 55 铁幕 / 57 超时空 → 进攻），2.4 曾把这些脚本一起覆盖掉，现已恢复并加构建期断言防回归）。另：新增一张纯平雪地 120 人地图（玩家居中、开局即被铁幕罩住、119 家均布全图）。电脑资金 ×1001、建造速度大幅提高、维修厂可建（AI 因此能补造基地车重建被摧毁的建造厂）。基地车与建造厂数值保持原版。
Terms=工具与文档 MIT；规则/地图为同人衍生素材，仅供非商业游玩。

